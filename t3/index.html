<style>
  :root{
    --ink:#1e222c; --paper:#faf7f0; --blue:#2463eb; --blue-d:#17419c;
    --coral:#eb574a; --sun:#ffc72c; --green:#22a860; --teal:#108a8d;

  body{
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:

      repeating-linear-gradient(0deg, transparent 0 63px, var(--grid) 63px 64px),

  }
  header{
    text-align:center; padding:48px 20px 28px;
  }
  .badge{
    display:inline-block; background:var(--coral); color:#fff; font-weight:800;

  }
  h1{
    font-size:clamp(1.6rem, 4vw, 2.6rem); font-weight:900;
    background:var(--sun); display:inline-block; padding:10px 34px;
    border:4px solid var(--ink); border-radius:60px; box-shadow:6px 6px 0 var(--ink);
  }
  header p{margin-top:16px; color:var(--blue-d); font-weight:600}
  main{max-width:1100px; margin:0 auto; padding:20px 20px 80px}

  .ep{
    background:var(--card); border:4px solid var(--ink); border-radius:28px;
    box-shadow:8px 8px 0 rgba(30,34,44,.85); margin-bottom:48px; overflow:hidden;
  }
  .ep-head{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:20px 24px; border-bottom:3px solid var(--ink);
    background:linear-gradient(90deg, rgba(255,199,44,.35), transparent);
  }
  .ep-num{
    background:var(--blue); color:#fff; font-weight:900; font-size:1.1rem;
    padding:8px 16px; border-radius:14px; border:3px solid var(--ink);
    font-family:Consolas, monospace;
  }
  .ep-head h2{font-size:1.25rem; font-weight:800}
  .ep-head .dur{
    margin-inline-start:auto; background:var(--teal); color:#fff;
    padding:5px 14px; border-radius:30px; font-size:.85rem; font-weight:700;
  }
  video{width:100%; display:block; background:#000; aspect-ratio:16/9}

  .pub{padding:22px 24px}
  .tabs{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap}
  .tab{
    cursor:pointer; font-weight:800; font-size:.95rem; padding:9px 20px;
    border:3px solid var(--ink); border-radius:40px; background:#eee;
    transition:.15s; user-select:none;
  }
  .tab.active-yt{background:#ff0033; color:#fff; box-shadow:3px 3px 0 var(--ink)}
  .tab.active-fb{background:#1877f2; color:#fff; box-shadow:3px 3px 0 var(--ink)}
  .panel{display:none}
  .panel.show{display:block}
  .field{margin-bottom:14px}
  .field label{
    display:inline-block; font-weight:800; font-size:.82rem; color:#fff;
    background:var(--ink); padding:3px 12px; border-radius:20px 20px 0 0;
    margin-bottom:0;
  }
  .field .val{
    background:#f6f3ea; border:2px solid var(--ink); border-radius:0 12px 12px 12px;
    padding:12px 14px; font-size:.92rem; line-height:1.8; white-space:pre-wrap;
    position:relative;
  }
  .val.title{font-weight:900; font-size:1.05rem; color:var(--blue-d)}
  .copy{
    position:absolute; top:8px; left:8px; cursor:pointer; font-size:.72rem;
    background:var(--green); color:#fff; border:2px solid var(--ink);
    border-radius:8px; padding:3px 10px; font-weight:700;
  }
  .copy:active{transform:scale(.94)}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    background:#fff; border:2px solid var(--teal); color:var(--teal);
    border-radius:20px; padding:3px 12px; font-size:.8rem; font-weight:700;
  }
  .meta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
  .meta{
    background:var(--sun); border:2px solid var(--ink); border-radius:12px;
    padding:6px 14px; font-size:.8rem; font-weight:800;
  }
  .dl{
    display:inline-block; margin-top:10px; background:var(--blue); color:#fff;
    text-decoration:none; font-weight:800; padding:9px 22px; border-radius:14px;
    border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); font-size:.9rem;
  }
  .dl.srt{background:var(--teal)}
  footer{text-align:center; padding:30px; color:var(--blue-d); font-weight:600}

</head>

function fieldHTML(label, value, cls="") {
  const esc = value.replace(/</g,"&lt;");
  return `<div class="field"><label>${label}</label>
    <div class="val ${cls}"><button class="copy" onclick="cp(this)">📋 نسخ</button>${esc}</div></div>`;
}
function listHTML(label, items) {
  return `<div class="field"><label>${label}</label>
    <div class="val">${items.map(i=>"• "+i).join("\n")}</div></div>`;
}
function cp(btn){
  const txt = btn.parentElement.innerText.replace("📋 نسخ","").trim();
  navigator.clipboard.writeText(txt).then(()=>{ btn.textContent="✅ تم"; setTimeout(()=>btn.textContent="📋 نسخ",1200); });
}
function switchTab(epId, which){
  document.getElementById(epId+"-yt-tab").className = "tab" + (which==="yt" ? " active-yt" : "");
  document.getElementById(epId+"-fb-tab").className = "tab" + (which==="fb" ? " active-fb" : "");
  document.getElementById(epId+"-yt").className = "panel" + (which==="yt" ? " show" : "");
  document.getElementById(epId+"-fb").className = "panel" + (which==="fb" ? " show" : "");
}
