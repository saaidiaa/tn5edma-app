<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نونو البومة 🦉 — فيديوهات تعليمية للأطفال</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:16px;padding:26px;
       background:linear-gradient(160deg,#ffe7c4,#ffc9d6 55%,#c9e9ff);
       color:#3c2a4e;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
  h1{margin:0;font-size:24px;font-weight:900}
  .sub{margin:0;opacity:.75;font-size:14px}
  .phone{padding:14px;border-radius:40px;background:#fff;
         border:4px solid #3c2a4e;box-shadow:0 20px 50px rgba(60,42,78,.35)}
  video{display:block;width:min(350px,84vw);aspect-ratio:9/16;border-radius:28px;background:#000}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{background:#fff;border:2px solid #3c2a4e;border-radius:999px;
        padding:5px 14px;font-size:13px;font-weight:700}
  a.dl{background:#ff6f91;color:#fff;text-decoration:none;font-weight:800;
       padding:11px 26px;border-radius:999px;border:3px solid #3c2a4e;font-size:15px}
</style>
</head>
<body>
  <h1>🦉 نونو البومة — الأعداد ١ ← ٥</h1>
  <p class="sub">الحلقة 1 · فيديو تعليمي للأطفال</p>

  <div class="phone">
    <video src="out/numbers_1_5.mp4" controls autoplay muted playsinline loop></video>
  </div>

  <div class="chips">
    <span class="chip">1080 × 1920</span>
    <span class="chip">30 fps</span>
    <span class="chip">≈ 83 ثانية</span>
    <span class="chip">صوت عربي</span>
  </div>
  <a class="dl" href="out/numbers_1_5.mp4" download>⬇ تحميل الفيديو</a>
  <p class="sub">🔊 الصوت مكتوم — إضغط على أيقونة الصوت في المشغّل.</p>

</html>
